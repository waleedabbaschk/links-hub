<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Links Hub - Sab kuch ek jagah</title>
  <meta name="description" content="500+ useful websites in one place for students, freelancers and everyone.">
  <link rel="icon" href="assets/icons/favicon.svg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/themes.css">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header class="top">
    <div class="wrap top-in">
      <a class="brand" href="#"><span class="logo">&#9670;</span> Links Hub</a>
      <div class="top-actions">
        <button id="favToggle" class="btn" title="Sirf favorites dikhao">&#9733; Favorites <span id="favCount">0</span></button>
        <button id="themeToggle" class="btn icon" title="Theme badlo">&#9790;</button>
      </div>
    </div>
  </header>

  <main class="wrap">
    <section class="hero">
      <span class="pill">&#10024; Students, freelancers aur sab ke liye</span>
      <h1>Sab zaroori websites, <span>ek jagah</span></h1>
      <p>Government, jobs, education, AI aur daily tools. Search karo aur seedha kholo.</p>
      <div class="searchbox">
        <span>&#128269;</span>
        <input id="search" type="search" placeholder="Search karo... (jaise: nadra, pdf, scholarship)" autocomplete="off">
        <kbd>/</kbd>
      </div>
      <div id="stats" class="stats"></div>
    </section>

    <nav id="cats" class="cats" aria-label="Categories"></nav>

    <div id="content"></div>
    <p id="empty" class="empty" hidden>Kuch nahi mila. Doosra word try karo.</p>
  </main>

  <footer class="foot">
    <div class="wrap">Banaya gaya pyaar se &#10084; &middot; Links Hub &copy; <span id="year"></span></div>
  </footer>

  <script src="data/links.js"></script>
  <script src="data/links-2.js" onerror="this.remove()"></script>
  <script src="data/links-3.js" onerror="this.remove()"></script>
  <script src="data/links-4.js" onerror="this.remove()"></script>
  <script src="data/links-5.js" onerror="this.remove()"></script>
  <script src="data/links-6.js" onerror="this.remove()"></script>
  <script src="data/links-7.js" onerror="this.remove()"></script>
  <script src="data/links-8.js" onerror="this.remove()"></script>
  <script src="data/links-9.js" onerror="this.remove()"></script>
  <script src="data/links-10.js" onerror="this.remove()"></script>
  <script src="js/theme.js"></script>
  <script src="js/favorites.js"></script>
  <script src="js/search.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
